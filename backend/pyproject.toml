[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-readiness-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "openai>=2,<3",
    "openpyxl>=3.1,<4", "python-multipart>=0.0.18,<1",
    "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2", "catboost>=1.2,<2", "matplotlib>=3.8,<4",
    "python-pptx>=1,<2", "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
